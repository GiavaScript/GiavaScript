name: Nightly Crystal CI

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        run: curl -fsSL https://crystal-lang.org/install.sh | sudo bash -s -- --channel=nightly

      - name: Run tests
        run: crystal spec

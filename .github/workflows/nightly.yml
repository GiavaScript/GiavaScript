name: Nightly Crystal CI

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: nightly

      - name: Run tests
        run: crystal spec

      - name: Run example smoke tests
        run: crystal run src/giavascript_cli.cr -- scripts/run_examples_smoke.js

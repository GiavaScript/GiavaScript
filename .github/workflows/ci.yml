name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'v*'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@44c8bd5f42f9ac08a7c9ebf9a75f16a7de79ccfd
        with:
          crystal: 1.19.1

      - name: Run tests
        run: crystal spec

      - name: Run example smoke tests
        run: crystal run src/giavascript_cli.cr -- scripts/run_examples_smoke.js

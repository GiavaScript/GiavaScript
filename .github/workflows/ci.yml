name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'v*'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal (Linux)
        if: runner.os == 'Linux'
        run: curl -fsSL https://crystal-lang.org/install.sh | sudo bash -s -- --version=1.19

      - name: Install Crystal (macOS/Windows)
        if: runner.os != 'Linux'
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1

      - name: Run tests
        run: crystal spec

      - name: Run example smoke tests
        run: crystal run src/giavascript_cli.cr -- scripts/run_examples_smoke.js
